# Building, testing and deploying to Azure.

name: Build, Test, and Deploy ASP.Net Core MVC app to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: mybooky
  TEST_PROJECT_DIR: 'MyBookyWebUnitTest'
  MAIN_PROJECTS_DIR: 'MyBookyWeb'
  NETCORE_VERSION: '8.x'

jobs:
  build_test_project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}

      - name: Cache dependencies for test project
        uses: actions/cache@v2
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore test project
        run: dotnet restore ${{ env.TEST_PROJECT_DIR }}

      - name: Publish test project
        run: |
          cd ${{ env.TEST_PROJECT_DIR }}
          dotnet publish --configuration Release --no-build --output ./bin/Release/net8.0

  build_main_projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}

      - name: Cache dependencies for main projects
        uses: actions/cache@v2
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore main projects
        run: dotnet restore ${{ env.MAIN_PROJECTS_DIR }}

      - name: Publish main projects
        run: |
          cd ${{ env.MAIN_PROJECTS_DIR }}
          dotnet publish --configuration Release --no-build --output ./myapp

  deploy:
    runs-on: ubuntu-latest
    needs: [build_test_project, build_main_projects]
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from test project build job
        uses: actions/download-artifact@v3
        with:
          name: test-app
          path: ${{ env.TEST_PROJECT_DIR }}/bin/Release/net8.0

      - name: Download artifact from main projects build job
        uses: actions/download-artifact@v3
        with:
          name: main-app
          path: ${{ env.MAIN_PROJECTS_DIR }}/myapp

      # Add deployment steps here
