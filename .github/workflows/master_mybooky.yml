# Building, testing and deploying to Azure.

name: Build, Test, and Deploy ASP.Net Core MVC app to Azure

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: mybooky
  TEST_PROJECT_DIR: 'MyBookyWebUnitTest'
  MAIN_PROJECTS_DIR: '.'
  NETCORE_VERSION: '8.x'

jobs:
  build_test_project:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}
          include-prerelease: true

      - name: Cache dependencies for test project
        uses: actions/cache@v2
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore test project
        run: dotnet restore ${{ env.TEST_PROJECT_DIR }}

      - name: Build test project
        run: dotnet build --no-restore -c Release ${{ env.TEST_PROJECT_DIR }}

      - name: Publish test project
        run: dotnet publish --configuration Release --no-build --output ${{ env.TEST_PROJECT_DIR }}/bin/Release/net8.0

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby', 'swift' ]
        # Use only 'java' to analyze code written in Java, Kotlin or both
        # Use only 'javascript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

  # cleanup:
  #   name: Cleanup CodeQL Database
  #   runs-on: ubuntu-latest
  #   needs: [codeql-analysis]
  #   steps:
  #     - name: Clean up CodeQL database
  #       run: /opt/hostedtoolcache/CodeQL/2.17.2/x64/codeql/codeql database cleanup /home/runner/work/_temp/codeql_databases/csharp --cache-cleanup=brutal


  build_main_projects:
    runs-on: ubuntu-latest
    needs: [build_test_project,codeql-analysis]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}
          include-prerelease: true

      - name: Cache dependencies for main projects
        uses: actions/cache@v2
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-



      - name: Build main projects
        run: dotnet build --configuration Release

      - name: Publish main projects
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: main-app
          path: ${{env.DOTNET_ROOT}}/myapp

          
  

  deploy:
    runs-on: windows-latest
    needs: [build_main_projects]
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      
      - name: Download artifact from main projects build job
        uses: actions/download-artifact@v4
        with:
          name: main-app
         
      - name: Deploy main projects to Azure Web App
        id: deploy-main-projects-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{env.MAIN_PROJECTS_DIR}}