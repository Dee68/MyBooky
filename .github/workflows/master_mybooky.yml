# Building, testing and deploying to Azure.

name: Build, Test, and Deploy ASP.Net Core MVC app to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: mybooky
  TEST_PROJECT_DIR: 'MyBookyWebUnitTest'
  MAIN_PROJECTS_DIR: '.'
  NETCORE_VERSION: '8.x'

jobs:
  build_test_project:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}
          include-prerelease: true

      - name: Cache dependencies for test project
        uses: actions/cache@v2
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore test project
        run: dotnet restore ${{ env.TEST_PROJECT_DIR }}

      - name: Build test project
        run: dotnet build --no-restore -c Release ${{ env.TEST_PROJECT_DIR }}

      - name: Publish test project
        run: dotnet publish --configuration Release --no-build --output ${{ env.TEST_PROJECT_DIR }}/bin/Release/net8.0


  build_main_projects:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}
          include-prerelease: true

      - name: Cache dependencies for main projects
        uses: actions/cache@v2
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-


      - name: Build main projects
        run: dotnet build --configuration Release

      - name: Publish main projects
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: main-app
          path: ${{env.DOTNET_ROOT}}/myapp

        # Logging step before deploy job
      # - name: Log before deployment
      #   run: echo "Logging before deployment..." >> before_deployment.log



  deploy:
    runs-on: windows-latest
    needs: [build_main_projects]
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      # - name: Download artifact from test project build job
      #   uses: actions/download-artifact@v3
      #   with:
      #     name: test-app
      #     path: ${{ env.TEST_PROJECT_DIR }}

      - name: Download artifact from main projects build job
        uses: actions/download-artifact@v4
        with:
          name: main-app
          #path: ${{ env.MAIN_PROJECTS_DIR }}

      # - name: Deploy test project to Azure Web App
      #   id: deploy-test-project-to-webapp
      #   uses: azure/webapps-deploy@v2
      #   with:
      #     app-name: ${{ env.AZURE_WEBAPP_NAME }}
      #     publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      #     package: ${{ env.TEST_PROJECT_DIR }}/bin/Release/net8.0

      - name: Deploy main projects to Azure Web App
        id: deploy-main-projects-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{env.MAIN_PROJECTS_DIR}}
      # Logging step after deploy job
      # - name: Log after deployment
      #   run: echo "Logging after deployment..." >> after_deployment.log

        # Additional steps for logging
      - name: Display logs
        run: |
         # echo "GitHub Actions Logs:"
         # echo "Before deployment log:"
         # cat before_deployment.log

         # echo "After deployment log:"
         # cat after_deployment.log
         cat /home/runner/work/_temp/*.log
