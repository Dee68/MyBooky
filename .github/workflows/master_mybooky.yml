# Building, testing and deploying to Azure.

name: Build,Test and Deploy ASP.Net Core MVC app to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
   AZURE_WEBAPP_NAME: mybooky
   AZURE_WEBAPP_PACKAGE_PATH: './published'
   NETCORE_VERSION: '8.x'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}
          include-prerelease: true

      - name: Restore
        run: dotnet restore

      - name: Build with dotnet
        run: dotnet build --no-restore -c Release

      - name: publish app for deploy
        run: dotnet publish --configuration Release --no-build --output ${{env.AZURE_WEBAPP_PACKAGE_PATH}}


      - name: upload artifact for deployment job
        uses: actions/upload-artifact@v3
        with:
          name: .net-app
          path: ${{env.azure_webapp_package_path}}


  deploy:
    runs-on: windows-latest
    needs: [build]
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v3
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{env.AZURE_WEBAPP_PACKAGE_PATH}}
          