name: Build, Test, Lint, and Deploy ASP.Net Core MVC app to Azure

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: mybooky
  TEST_PROJECT_DIR: 'MyBookyWebUnitTest'
  MAIN_PROJECTS_DIR: '.'
  NETCORE_VERSION: '8.x'
  NODE_VERSION: '20.x'

permissions:
  contents: write
  pull-requests: write
  packages: read
  statuses: write

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}

      - name: Install dotnet format
        run: dotnet tool install -g dotnet-format

      - name: Run dotnet format
        id: format
        run: dotnet format --verbosity diagnostic
        env:
          PATH: ${{ github.env.PATH }}:/home/runner/.dotnet/tools

      - name: Commit changes if any
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Automated code formatting" || echo "No changes to commit"

      - name: Create new branch for changes
        id: create_branch
        run: |
          BRANCH_NAME=auto-fix-branch-${{ github.sha }}
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

      - name: Push changes to new branch
        run: |
          git push origin HEAD:${BRANCH_NAME}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH_NAME }}
          title: "Automated code formatting fixes"
          body: "This pull request contains automated code formatting fixes."
          base: master


  dev:
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    environment: development
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}
          include-prerelease: true

      - name: Cache dependencies for test project
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore test project
        run: dotnet restore ${{ env.TEST_PROJECT_DIR }}

      - name: Build test project
        run: dotnet build --no-restore -c Release ${{ env.TEST_PROJECT_DIR }}

      - name: Publish test project
        run: dotnet publish --configuration Release --no-build --output ${{ env.TEST_PROJECT_DIR }}/bin/Release/net8.0

      - name: Cache dependencies for main projects
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore main projects
        run: dotnet restore ${{ env.MAIN_PROJECTS_DIR }}

      - name: Build main projects
        run: dotnet build --configuration Release ${{ env.MAIN_PROJECTS_DIR }}

      - name: Publish main projects
        run: dotnet publish -c Release -o ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: main-app
          path: ${{ env.DOTNET_ROOT }}/myapp
     # Run unit tests
      - name: Run unit tests
        run: dotnet test ${{ env.TEST_PROJECT_DIR }} -c Release --no-build --verbosity normal

  staging:
    runs-on: ubuntu-latest
    needs: [dev]
    environment: 'Staging'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: 'csharp,javascript'

      - name: Autobuild for CodeQL
        uses: github/codeql-action/autobuild@v2

      - name: Echo Staging Environment
        run: echo "I am in the Staging environment"

  debugging:
    runs-on: ubuntu-latest
    needs: [staging]
    environment: 'Debugging'
    steps:
      - name: Run OWASP ZAP Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net'
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Upload ZAP Report
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: zap-report
      #     path: /home/runner/work/_temp/zap/report.html

  production:
    runs-on: ubuntu-latest
    needs: [staging]
    environment:
      name: 'Production'
      url: ${{ steps.deploy-main-projects-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download artifact from main projects build job
        uses: actions/download-artifact@v4
        with:
          name: main-app

      - name: Deploy main projects to Azure Web App
        id: deploy-main-projects-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{env.MAIN_PROJECTS_DIR}}
