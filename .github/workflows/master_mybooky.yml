name: Build, Test, and Deploy ASP.Net Core MVC app to Azure

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: mybooky
  TEST_PROJECT_DIR: 'MyBookyWebUnitTest'
  MAIN_PROJECTS_DIR: '.'
  NETCORE_VERSION: '8.x'

jobs:
  dev:
    runs-on: ubuntu-latest
    environment: development
    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Set up .NET Core
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}
          include-prerelease: true

      # Cache dependencies for test project
      - name: Cache dependencies for test project
        uses: actions/cache@v2
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore test project
      - name: Restore test project
        run: dotnet restore ${{ env.TEST_PROJECT_DIR }}

      # Build test project
      - name: Build test project
        run: dotnet build --no-restore -c Release ${{ env.TEST_PROJECT_DIR }}

      # Publish test project
      - name: Publish test project
        run: dotnet publish --configuration Release --no-build --output ${{ env.TEST_PROJECT_DIR }}/bin/Release/net8.0

      # Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: 'csharp,javascript'

      # Autobuild for CodeQL
      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      # Cache dependencies for main projects
      - name: Cache dependencies for main projects
        uses: actions/cache@v2
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Initialize Lint
      - name: Checkout Git Repository
        uses: actions/checkout@v3

      # Set up
      - name: Set up .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}

      # Run Linters
      - name: Run Linters
        uses: wearerequired/lint-action@v2
        with:
          dotnet_format: true

      # Check runs with annotations
      - name: Create check runs with commit annotations
        uses: actions/github-script@v4
        with:
          github-token: ${{secrets.GH_TOKEN}}
          script: |
            const { getOctokit } = require('@actions/github');
            const octokit = getOctokit('${{ secrets.GH_TOKEN }}');

            // Fetch the commit SHA
            const commitSHA = context.payload.after;

            // Create check runs with annotations
            const annotations = [
              // Add your annotations here
            ];

            await octokit.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Lint Check',
              head_sha: commitSHA,
              status: 'completed',
              conclusion: 'success', // or 'failure' depending on your criteria
              output: {
                title: 'Lint Check Results',
                summary: 'Linting completed with errors/warnings.',
                annotations: annotations.slice(0, 50) // Limit to first 50 annotations
              }
            });

      # Build main projects
      - name: Build main projects
        run: dotnet build --configuration Release

      # Publish main projects
      - name: Publish main projects
        run: dotnet publish -c Release -o ${{ env.DOTNET_ROOT }}/myapp

      # Upload artifact for deployment job
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: main-app
          path: ${{ env.DOTNET_ROOT }}/myapp

      # Echo Development Environment
      - name: Echo Development Environment
        run: echo "I am in the Development environment"

  staging:
    runs-on: windows-latest
    needs: [dev]
    environment: 'Staging'
    steps:
      - name: Echo Staging Environment
        run: echo "I am in the Staging environment"

  production:
    runs-on: windows-latest
    needs: [staging]
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download artifact from main projects build job
        uses: actions/download-artifact@v4
        with:
          name: main-app
         
      - name: Deploy main projects to Azure Web App
        id: deploy-main-projects-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{env.MAIN_PROJECTS_DIR}}
