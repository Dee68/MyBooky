name: Build, Test, and Deploy ASP.Net Core MVC app to Azure

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: mybooky
  TEST_PROJECT_DIR: 'MyBookyWebUnitTest'
  MAIN_PROJECTS_DIR: '.'
  NETCORE_VERSION: '8.x'
  NODE_VERSION: '20.x'

jobs:
  dev:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Checkout repository
      - uses: actions/checkout@v4

      # Set up .NET Core
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}
          include-prerelease: true

      # Cache dependencies for test project
      - name: Cache dependencies for test project
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore test project
      - name: Restore test project
        run: dotnet restore ${{ env.TEST_PROJECT_DIR }}

      # Build test project
      - name: Build test project
        run: dotnet build --no-restore -c Release ${{ env.TEST_PROJECT_DIR }}

      # Publish test project
      - name: Publish test project
        run: dotnet publish --configuration Release --no-build --output ${{ env.TEST_PROJECT_DIR }}/bin/Release/net8.0

      # Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: 'csharp,javascript'

      # Autobuild for CodeQL
      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      # Cache dependencies for main projects
      - name: Cache dependencies for main projects
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Initialize Lint
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      # Set up .NET
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}

      # Initialize Lint
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      # Set up
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}

      # Run Super-Linter
      - name: Run Super-Linter
        uses: github/super-linter@v4
        env:
          VALIDATE_CSHARP: true
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Run dotnet format
      - name: Install dotnet format
        run: dotnet tool install -g dotnet-format

      - name: Run dotnet format with verify-no-changes and diagnostics
        run: dotnet format ${{ env.MAIN_PROJECTS_DIR }}/MyBooky.sln --verify-no-changes --verbosity diagnostic
        env:
          DOTNET_ROOT: /home/runner/.dotnet

      # Build main projects
      - name: Build main projects
        run: dotnet build --configuration Release

      # Publish main projects
      - name: Publish main projects
        run: dotnet publish -c Release -o ${{ env.DOTNET_ROOT }}/myapp

      # Upload artifact for deployment job
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: main-app
          path: ${{ env.DOTNET_ROOT }}/myapp

      # Echo Development Environment
      - name: Echo Development Environment
        run: echo "I am in the Development environment"

  staging:
    runs-on: windows-latest
    needs: [dev]
    environment: 'Staging'
    steps:
      - name: Echo Staging Environment
        run: echo "I am in the Staging environment"

  production:
    runs-on: windows-latest
    needs: [staging]
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download artifact from main projects build job
        uses: actions/download-artifact@v4
        with:
          name: main-app
         
      - name: Deploy main projects to Azure Web App
        id: deploy-main-projects-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{env.MAIN_PROJECTS_DIR}}
