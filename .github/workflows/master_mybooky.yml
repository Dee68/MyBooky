# Building, testing and deploying to Azure.

name: Build,Test and Deploy ASP.Net Core MVC app to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
   AZURE_WEBAPP_NAME: mybooky
   AZURE_WEBAPP_PACKAGE_PATH: './published'
   NETCORE_VERSION: '8.x'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.NETCORE_VERSION }}
          include-prerelease: true

      - name: Restore
        run: dotnet restore

      - name: Build with dotnet
        run: dotnet build --no restore -c Release

      - name: publish app for deploy
        run: dotnet publish --configuration Release --no-build --output ${{env.AZURE_WEBAPP_PACKAGE_PATH}}

      # - name: Print folders in published directory
      #   run: |
      #     $directories = Get-ChildItem -Path ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} -Directory
      #     foreach ($dir in $directories) {
      #       Write-Host "Folder: $($dir.Name)"
      #     }


      - name: upload artifact for deployment job
        uses: actions/upload-artifact@v3
        with:
          name: .net-app
          path: ${{env.azure_webapp_package_path}}

