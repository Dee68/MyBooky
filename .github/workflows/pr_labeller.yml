name: Pull Request Labeller

on:
  pull_request_review:
    types: [submitted]

jobs:
  labelWhenApproved:
    name: Label PR when approved
    runs-on: ubuntu-latest
    steps:
      - name: Label PR when approved
        uses: pullreminders/label-when-approved-action@master
        env:
          APPROVALS: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADD_LABEL: "approved"
